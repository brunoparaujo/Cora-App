name: Deploy Cora to Firebase Hosting
 
on:
  push:
    branches:
      - main
 
permissions:
  contents: read
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_DA_CORA }}
          projectId: app-da-cora
          channelId: live
